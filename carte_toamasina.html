<style>
.leaflet-popup-content-wrapper{border-radius:12px;padding:0;overflow:hidden;
  box-shadow:0 8px 28px rgba(0,0,0,.28);}
.leaflet-popup-content{margin:0 !important;}
.pop{width:400px;font-family:'Segoe UI',Arial,sans-serif;font-size:12.5px;color:#2c3e50;}
.pop-head{background:linear-gradient(135deg,var(--accent),#222);color:#fff;padding:14px 18px;}
.pop-sub{font-size:10px;letter-spacing:2px;opacity:.8;}
.pop-title{font-size:22px;font-weight:700;}
.pop-stats{display:flex;background:#f6f8fa;border-bottom:1px solid #e3e7ea;}
.pop-stats div{flex:1;text-align:center;padding:10px 4px;border-right:1px solid #e3e7ea;}
.pop-stats div:last-child{border-right:0;}
.pop-stats b{display:block;font-size:18px;color:var(--accent);}
.pop-stats span{font-size:10.5px;color:#7f8c8d;text-transform:uppercase;}
.pop-search{width:calc(100% - 24px);margin:10px 12px 6px;padding:7px 10px;
  border:1px solid #d0d7de;border-radius:6px;font-size:12px;box-sizing:border-box;outline:none;}
.pop-search:focus{border-color:var(--accent);}
.pop-body{max-height:300px;overflow-y:auto;padding:4px 12px 12px;}
.pop details.d{border:1px solid #e3e7ea;border-radius:8px;margin:6px 0;background:#fff;}
.pop details.d>summary{padding:8px 10px;font-weight:600;cursor:pointer;
  background:#fafbfc;border-radius:8px;}
.pop details.c{margin:2px 10px;border-left:3px solid var(--accent);padding-left:6px;}
.pop details.c>summary{padding:5px 4px;cursor:pointer;}
.pop summary em{float:right;font-style:normal;font-size:10.5px;color:#95a5a6;}
.pop .tag{background:var(--accent);color:#fff;font-size:9px;padding:2px 6px;
  border-radius:10px;margin-right:4px;text-transform:uppercase;}
.pop .tag.t2{background:#7f8c8d;}
.pop ul{margin:2px 0 8px 18px;padding:0;columns:2;column-gap:14px;}
.pop li{font-size:11.5px;padding:1px 0;break-inside:avoid;}
.pop li.vide{color:#aaa;font-style:italic;}
.pop-body::-webkit-scrollbar{width:6px;}
.pop-body::-webkit-scrollbar-thumb{background:#c5ccd3;border-radius:3px;}
</style>
