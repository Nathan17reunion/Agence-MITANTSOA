<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Mitantsoa animé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ===== 1. VARIABLES (vos couleurs) ===== */
:root{
  --color-bg:#F6F1E7;
  --color-green:#24463B;
  --color-ochre:#B9781E;
  --color-ochre-text:#8A5A12;
}
body{margin:0;background:var(--color-bg);font-family:'Sora',sans-serif}

/* ===== 2. BLOC LOGO ===== */
.logo{
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:32px;overflow:hidden;
}

/* ===== 3. EMBLÈME M : zoom au survol et au clic ===== */
.logo__emblem{
  width:min(60vw,360px);height:auto;cursor:pointer;
  transition:transform .35s ease;
}
.logo__emblem:hover{transform:scale(1.15)}
.logo__emblem:active{transform:scale(1.3)}

.logo__tag{cursor:pointer;transition:transform .35s ease}
.logo__tag:hover{transform:scale(1.15)}
.logo__tag:active{transform:scale(1.3)}

/* ===== 4. LETTRES : déplacement gauche -> droite -> retour en 30 s ===== */
.logo__word{
  display:flex;
  font-size:clamp(36px,9vw,84px);font-weight:700;letter-spacing:.14em;line-height:1;
  animation:slide 30s linear infinite;      /* ← durée du va-et-vient */
}
@keyframes slide{
  0%,100%{transform:translateX(-40px)}     /* ← amplitude vers la gauche */
  50%{transform:translateX(40px)}          /* ← amplitude vers la droite */
}

/* ===== 5. COULEURS : rouge -> vert -> bleu en boucle ===== */
.logo__word span{
  animation:rgb 6s linear infinite;         /* ← vitesse du changement de couleur */
  animation-delay:calc(var(--i) * -0.4s);   /* ← décalage entre lettres (effet vague) */
}
@keyframes rgb{
  0%,100%{color:#D62828}   /* rouge */
  33%{color:#2E9E4F}       /* vert  */
  66%{color:#1F6FEB}       /* bleu  */
}

.logo__tag{
  font-size:clamp(12px,2.2vw,22px);font-weight:600;letter-spacing:.42em;
  color:var(--color-ochre-text);
}

/* Accessibilité : coupe les animations si l'utilisateur le demande */
@media (prefers-reduced-motion:reduce){
  .logo__word,.logo__word span{animation:none}
  .logo__word span{color:var(--color-green)}
}
</style>

<script>
const TAGS = {
  fr:"AGENCE · SANTÉ",
  en:"HEALTH AGENCY",
  mg:"MASOIVOHO · FAHASALAMANA",
  es:"AGENCIA · SALUD",
  de:"AGENTUR · GESUNDHEIT",
  it:"AGENZIA · SALUTE",
  pt:"AGÊNCIA · SAÚDE",
  nl:"BUREAU · GEZONDHEID",
  ar:"وكالة · الصحة",
  ko:"보건 · 기구",
  ja:"機関 · 健康",
  ru:"АГЕНТСТВО · ЗДОРОВЬЕ",
  el:"ΥΠΗΡΕΣΙΑ · ΥΓΕΙΑ",
  hi:"एजेंसी · स्वास्थ्य",
  zh:"机构 · 健康"
};

function setLogoLang(lang){
  const l = (lang || "en").slice(0,2).toLowerCase();
  const el = document.getElementById("logo-tag");
  el.textContent = TAGS[l] || TAGS.en;          // langue inconnue → anglais
  el.dir = l === "ar" ? "rtl" : "ltr";
  el.style.letterSpacing = l === "ar" ? "0" : ""; // l'arabe ne supporte pas l'espacement entre lettres
}

// Au chargement : langue du navigateur du visiteur
setLogoLang(navigator.language);
</script>

</head>
<body>

<!-- ===== HTML À COPIER DANS VOTRE PAGE ===== -->
<section class="logo">
  <svg class="logo__emblem" viewBox="0 0 200 200" role="img" aria-label="Emblème Mitantsoa">
    <circle cx="100" cy="100" r="90" fill="none" stroke="#24463B" stroke-width="8"/>
    <path d="M52 148 L52 66 L100 116 L148 66 L148 148" fill="none" stroke="#24463B" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="100" y1="52" x2="100" y2="158" stroke="#B9781E" stroke-width="6" stroke-linecap="round"/>
    <path d="M100 62 C132 66 132 90 100 94 C68 98 68 122 100 126 C120 129 126 143 108 154" fill="none" stroke="#B9781E" stroke-width="6" stroke-linecap="round"/>
    <path d="M100 18 C100 18 114 34 114 43 A14 14 0 0 1 86 43 C86 34 100 18 100 18 Z" fill="#B9781E"/>
  </svg>

  <div class="logo__word" aria-label="Mitantsoa">
    <span style="--i:0">M</span><span style="--i:1">I</span><span style="--i:2">T</span>
    <span style="--i:3">A</span><span style="--i:4">N</span><span style="--i:5">T</span>
    <span style="--i:6">S</span><span style="--i:7">O</span><span style="--i:8">A</span>
  </div>

  <div class="logo__tag" id="logo-tag">AGENCE · SANTÉ</div>
</section>

</body>
</html>
