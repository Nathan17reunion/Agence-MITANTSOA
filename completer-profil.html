<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compléter mon profil — Agence Mitantsoa</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png?v=2">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f6f4ee;
      color: #243746;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    header {
      background: #243746;
      padding: 18px 24px;
    }

    .logo {
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      font-size: 1.15rem;
    }

    .logo span { color: #e7c393; }

    main {
      width: min(100% - 32px, 760px);
      margin: 48px auto 72px;
      background: #fff;
      border: 1px solid #e4dccb;
      border-top: 5px solid #b9781e;
      border-radius: 18px;
      padding: 36px;
      box-shadow: 0 18px 45px rgba(36, 55, 70, .08);
    }

    .sur-titre {
      color: #986016;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 10px;
    }

    h1 { margin: 0 0 12px; }

    .champ { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: .92rem;
    }

    input, select {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #d9d0bf;
      border-radius: 10px;
      font: inherit;
      background: #fff;
    }

    input:disabled {
      background: #f2efe8;
      color: #5d6870;
    }

    .double {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px 18px;
      border: none;
      border-radius: 10px;
      background: #243746;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      min-height: 26px;
      margin-top: 16px;
      font-weight: 600;
    }

    .succes { color: #256b45; }
    .erreur { color: #923b32; }

    @media (max-width: 620px) {
      .double { grid-template-columns: 1fr; }
      main { padding: 26px 18px; }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="mon-espace.html">
      Agence <span>Mitantsoa</span>
    </a>
  </header>

  <main>
    <p class="sur-titre">Création du profil</p>
    <h1>Complétez vos informations</h1>

    <p>
      Ces informations permettent à l’Agence Mitantsoa de personnaliser
      son accompagnement et de vous contacter si nécessaire.
    </p>

    <form id="formulaire-profil" novalidate>
      <div class="double">
        <div class="champ">
          <label for="prenom">Prénom *</label>
          <input type="text" id="prenom" required autocomplete="given-name">
        </div>

        <div class="champ">
          <label for="nom">Nom *</label>
          <input type="text" id="nom" required autocomplete="family-name">
        </div>
      </div>

      <div class="champ">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" disabled>
      </div>

      <div class="double">
        <div class="champ">
          <label for="date-naissance">Date de naissance *</label>
          <input type="date" id="date-naissance" required>
        </div>

        <div class="champ">
          <label for="sexe">Sexe</label>
          <select id="sexe">
            <option value="">Non précisé</option>
            <option value="feminin">Féminin</option>
            <option value="masculin">Masculin</option>
            <option value="autre">Autre</option>
          </select>
        </div>
      </div>

      <div class="champ">
        <label for="telephone">Téléphone</label>
        <input type="tel" id="telephone" autocomplete="tel"
               placeholder="Ex. : +33 6 12 34 56 78">
      </div>

      <div class="champ">
        <label for="adresse">Adresse</label>
        <input type="text" id="adresse" autocomplete="street-address"
               placeholder="Numéro, rue, complément">
      </div>

      <div class="double">
        <div class="champ">
          <label for="ville">Ville</label>
          <input type="text" id="ville" autocomplete="address-level2">
        </div>

        <div class="champ">
          <label for="code-postal">Code postal</label>
          <input type="text" id="code-postal" autocomplete="postal-code">
        </div>
      </div>

      <div class="champ">
        <label for="pays">Pays</label>
        <input type="text" id="pays" autocomplete="country-name" value="France">
      </div>

      <button type="submit" id="bouton-enregistrer">
        Enregistrer mon profil
      </button>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script type="module">
        import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      initializeFirestore,
      doc,
      setDoc,
      getDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAC4g13dQqwWB3hrtjU6a1dAP91FviHHMI",
      authDomain: "connexion-mitantsoa-angence.firebaseapp.com",
      projectId: "connexion-mitantsoa-angence",
      storageBucket: "connexion-mitantsoa-angence.firebasestorage.app",
      messagingSenderId: "857962704410",
      appId: "1:857962704410:web:984c9936b3f22742fc6ba3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // Détection automatique du mode de connexion (évite « client is offline »
    // quand un pare-feu, une extension ou un réseau bloque les WebSockets).
    const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

    const formulaire = document.getElementById("formulaire-profil");
    const message = document.getElementById("message");
    const bouton = document.getElementById("bouton-enregistrer");
    const champ = (id) => document.getElementById(id);

    let utilisateurConnecte = null;
    let profilExiste = false;

    // Abandonne si Firestore ne répond pas (au lieu d'attendre indéfiniment)
    const avecDelai = (promesse, ms = 15000) =>
      Promise.race([
        promesse,
        new Promise((_, rejet) => setTimeout(() => rejet(new Error("delai-depasse")), ms))
      ]);

    // « Marie Dupont » -> prénom « Marie », nom « Dupont »
    function separerNom(nomComplet) {
      const mots = (nomComplet || "").trim().split(/\s+/).filter(Boolean);
      if (mots.length < 2) return { prenom: mots[0] || "", nom: "" };
      return { prenom: mots.slice(0, -1).join(" "), nom: mots[mots.length - 1] };
    }

    const formaterNom = (s) => s.trim().toLocaleUpperCase("fr-FR");
    const formaterPrenom = (s) =>
      s.trim().toLocaleLowerCase("fr-FR")
        .replace(/(^|[\s'’-])(\p{L})/gu, (m, a, b) => a + b.toLocaleUpperCase("fr-FR"));

    function messageErreur(erreur, action) {
      if (erreur && erreur.code === "permission-denied")
        return "Accès refusé par les règles de la base de données (Firestore).";
      if (erreur && (erreur.code === "unavailable" || erreur.message === "delai-depasse"))
        return "Connexion à la base de données impossible pour le moment. Réessayez dans un instant.";
      return action === "charger"
        ? "Impossible de charger votre profil pour le moment."
        : "L’enregistrement a échoué. Vérifiez votre connexion ou réessayez.";
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.replace("connexion.html");
        return;
      }

      // Recharge l'état du compte (l'e-mail vient peut-être d'être vérifié)
      try { await user.reload(); } catch (e) {}

      utilisateurConnecte = user;
      champ("email").value = user.email || "";

      if (!user.emailVerified) {
        window.location.replace("verification-email.html");
        return;
      }

      // 1. Préremplissage automatique avec ce que le compte connaît déjà
      const suggestion = separerNom(user.displayName);
      champ("prenom").value = suggestion.prenom;
      champ("nom").value = suggestion.nom;
      if (user.phoneNumber) champ("telephone").value = user.phoneNumber;

      // 2. Puis avec le profil déjà enregistré dans Firestore (collection « clients »)
      try {
        const documentProfil = await avecDelai(getDoc(doc(db, "clients", user.uid)));
        profilExiste = documentProfil.exists();

        if (profilExiste) {
          const d = documentProfil.data();
          const remplir = (id, valeur) => { if (valeur) champ(id).value = valeur; };

          remplir("prenom", d.prenom);
          remplir("nom", d.nom);
          remplir("date-naissance", d.dateNaissance);
          remplir("sexe", d.sexe);
          remplir("telephone", d.telephone);
          remplir("adresse", d.adresse);
          remplir("ville", d.ville);
          remplir("code-postal", d.codePostal);
          remplir("pays", d.pays);

          message.className = "message succes";
          message.textContent = "Votre profil existe déjà. Vous pouvez le mettre à jour.";
        }
      } catch (erreur) {
        console.error(erreur);
        message.className = "message erreur";
        message.textContent = messageErreur(erreur, "charger");
      }
    });

    formulaire.addEventListener("submit", async (evenement) => {
      evenement.preventDefault();

      if (!utilisateurConnecte) {
        window.location.replace("connexion.html");
        return;
      }

      const prenom = champ("prenom").value.trim();
      const nom = champ("nom").value.trim();
      const dateNaissance = champ("date-naissance").value;

      message.className = "message erreur";

      if (!prenom || !nom || !dateNaissance) {
        message.textContent =
          "Veuillez renseigner votre prénom, votre nom et votre date de naissance.";
        return;
      }

      if (new Date(dateNaissance) > new Date()) {
        message.textContent = "La date de naissance ne peut pas être dans le futur.";
        return;
      }

      bouton.disabled = true;
      message.textContent = "Enregistrement en cours…";

      const donnees = {
        uid: utilisateurConnecte.uid,
        email: utilisateurConnecte.email,
        emailVerifie: utilisateurConnecte.emailVerified,
        prenom: formaterPrenom(prenom),
        nom: formaterNom(nom),
        dateNaissance: dateNaissance,
        sexe: champ("sexe").value,
        telephone: champ("telephone").value.trim(),
        adresse: champ("adresse").value.trim(),
        ville: champ("ville").value.trim(),
        codePostal: champ("code-postal").value.trim(),
        pays: champ("pays").value.trim(),
        profilComplete: true,
        dateModification: serverTimestamp()
      };

      // La date de création n'est écrite qu'une seule fois
      if (!profilExiste) donnees.dateCreation = serverTimestamp();

      try {
        await avecDelai(
          setDoc(doc(db, "clients", utilisateurConnecte.uid), donnees, { merge: true })
        );
        profilExiste = true;

        message.className = "message succes";
        message.textContent = "Votre profil a bien été enregistré.";

        setTimeout(() => {
          window.location.replace("mon-espace.html");
        }, 1500);

      } catch (erreur) {
        console.error(erreur);
        message.className = "message erreur";
        message.textContent = messageErreur(erreur, "enregistrer");
      } finally {
        bouton.disabled = false;
      }
    });
  </script>
</body>
</html>
